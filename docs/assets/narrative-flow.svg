<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" font-family="IBM Plex Sans, Arial, sans-serif">
<rect width="960" height="220" fill="#FFFFFF"/>
<text x="24" y="36" font-size="18" font-weight="600" fill="#1C1C2E">The six-step narrative flow</text>
<circle cx="40" cy="78" r="14" fill="#1B4FD8"/>
<text x="40" y="83" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="24" y="116" font-size="13" font-weight="600" fill="#1C1C2E">Quantified tension</text>
<text x="24" y="134" font-size="10.5" fill="#6B7280">Measurable problem</text>
<text x="24" y="148" font-size="10.5" fill="#6B7280">or paradox</text>
<path d="M 158 78 l 10 0 m -4 -4 l 4 4 l -4 4" stroke="#6B9EFF" stroke-width="2" fill="none"/>
<circle cx="192" cy="78" r="14" fill="#0F2F8A"/>
<text x="192" y="83" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="176" y="116" font-size="13" font-weight="600" fill="#1C1C2E">Answer first</text>
<text x="176" y="134" font-size="10.5" fill="#6B7280">Conclusion before</text>
<text x="176" y="148" font-size="10.5" fill="#6B7280">detail</text>
<path d="M 310 78 l 10 0 m -4 -4 l 4 4 l -4 4" stroke="#6B9EFF" stroke-width="2" fill="none"/>
<circle cx="344" cy="78" r="14" fill="#1B4FD8"/>
<text x="344" y="83" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="328" y="116" font-size="13" font-weight="600" fill="#1C1C2E">Exhibit cascade</text>
<text x="328" y="134" font-size="10.5" fill="#6B7280">Evidence in</text>
<text x="328" y="148" font-size="10.5" fill="#6B7280">numbered layers</text>
<path d="M 462 78 l 10 0 m -4 -4 l 4 4 l -4 4" stroke="#6B9EFF" stroke-width="2" fill="none"/>
<circle cx="496" cy="78" r="14" fill="#0F2F8A"/>
<text x="496" y="83" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="480" y="116" font-size="13" font-weight="600" fill="#1C1C2E">Cohort or framework</text>
<text x="480" y="134" font-size="10.5" fill="#6B7280">Pattern named</text>
<text x="480" y="148" font-size="10.5" fill="#6B7280">after proof</text>
<path d="M 614 78 l 10 0 m -4 -4 l 4 4 l -4 4" stroke="#6B9EFF" stroke-width="2" fill="none"/>
<circle cx="648" cy="78" r="14" fill="#1B4FD8"/>
<text x="648" y="83" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="632" y="116" font-size="13" font-weight="600" fill="#1C1C2E">Playbook close</text>
<text x="632" y="134" font-size="10.5" fill="#6B7280">A short set</text>
<text x="632" y="148" font-size="10.5" fill="#6B7280">of actions</text>
<path d="M 766 78 l 10 0 m -4 -4 l 4 4 l -4 4" stroke="#6B9EFF" stroke-width="2" fill="none"/>
<circle cx="800" cy="78" r="14" fill="#0F2F8A"/>
<text x="800" y="83" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="784" y="116" font-size="13" font-weight="600" fill="#1C1C2E">Method and byline</text>
<text x="784" y="134" font-size="10.5" fill="#6B7280">Scope, source,</text>
<text x="784" y="148" font-size="10.5" fill="#6B7280">ownership</text>
<text x="24" y="204" font-family="IBM Plex Mono, Consolas, monospace" font-size="10" fill="#6B7280">BHIL INSIDE QUANTUMBLACK STUDY</text>
<text x="936" y="204" font-family="IBM Plex Mono, Consolas, monospace" font-size="10" fill="#6B7280" text-anchor="end">HUMAN-DIRECTED. AI-ENABLED. COMMERCIALLY TESTED.</text>
</svg>
